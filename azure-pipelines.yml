
trigger:
  - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solution: '**/KnowledgeAssistant.slnx'
  apiProject: 'KnowledgeAssistant.API/KnowledgeAssistant.API.csproj'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore solution'
    inputs:
      command: 'restore'
      projects: '$(solution)'

  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: '$(solution)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Run tests'
    inputs:
      command: 'test'
      projects: '**/*Tests/*.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build'
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: 'Publish API'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: '$(apiProject)'
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/api --no-build'
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish deployment artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/api'
      ArtifactName: 'api'
      publishLocation: 'Container'

  - task: AzureWebApp@1
    displayName: 'Deploy API to Azure App Service'
    inputs:
      azureSubscription: 'KnowledgeAssistant-Azure'
      appType: 'webApp'
      appName: 'knowledgeassistant-api'
      package: '$(Build.ArtifactStagingDirectory)/api/**/*.zip'
      deploymentMethod: 'zipDeploy'

  - task: DotNetCoreCLI@2
    displayName: 'Publish Blazor UI'
    inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'KnowledgeAssistant.UI/KnowledgeAssistant.UI.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/ui --no-build'
        zipAfterPublish: true

  - task: AzureWebApp@1
    displayName: 'Deploy Blazor UI to Azure App Service'
    inputs:
      azureSubscription: 'KnowledgeAssistant-Azure'
      appType: 'webApp'
      appName: 'knowledgeassistant-ui-e2hwbcexacddeabz'
      package: '$(Build.ArtifactStagingDirectory)/ui/**/*.zip'
      deploymentMethod: 'zipDeploy'
